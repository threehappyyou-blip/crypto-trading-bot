name: Crypto Trading Bot (Paper Trading)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 한글 폰트 설치 (히트맵 리포트용)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 봇 1회 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: 실행 결과(로그/포트폴리오 상태) 커밋
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "chore: update bot state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
